name = "self-serve-pooja-sync"
main = "puja-room.js"
compatibility_date = "2026-08-20"

[[durable_objects.bindings]]
name = "PUJA_ROOM"
class_name = "PujaRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PujaRoom"]

# Pages Function ला D1 शी संपर्क साधण्याची गरज नाही (ते आधीच functions/api/admin/* मध्ये स्वतंत्र
# बांधलेले आहे), पण याच DO ला कायमस्वरूपी पूजा-यादी (poojas table) अद्ययावत करता यावी म्हणून इथेही
# तीच D1 database बांधलेली आहे.
[[d1_databases]]
binding = "POOJAS_DB"
database_name = "puje-sathi-poojas"
database_id = "808162ae-8e0a-40fa-9b7d-3c230d6e88b6"
